# Standalone "just Docker, no Aspire" local option.
# For the Aspire-orchestrated alternative (dashboard, OTel out of the box), use `aspire run`
# from the repository root instead (requires Docker for the Postgres container either way).
#
# Usage:
#   docker compose up --build
#   API:       http://localhost:8080
#   Scalar:    http://localhost:8080/scalar (Development environment only)
#   Keycloak:  http://localhost:8180 (admin console: admin / admin, DEV ONLY)

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cleanarchitecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanarchitecture"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local identity provider. The realm (clients, scopes, test user) is imported from deploy/keycloak on startup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      # DEV ONLY credentials for the admin console.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Frontend URL: tokens always carry iss=http://localhost:8180/realms/clean-architecture, whether requested from
      # the host or from inside the network. Backchannel endpoints (JWKS, token) keep the caller's host, so the API
      # container can download signing keys from http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      # The image ships no curl/wget: probe the management port's readiness endpoint over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/CleanArchitecture.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=cleanarchitecture;Username=postgres;Password=postgres"
      # Signing keys are discovered through the internal network name; issuer and audience are validated against the
      # host-facing URL tokens are issued with. Plain HTTP metadata is acceptable only for this local setup.
      Authentication__Schemes__Bearer__Authority: http://keycloak:8080/realms/clean-architecture
      Authentication__Schemes__Bearer__ValidIssuers__0: http://localhost:8180/realms/clean-architecture
      Authentication__Schemes__Bearer__ValidAudiences__0: clean-architecture-api
      Authentication__Schemes__Bearer__RequireHttpsMetadata: "false"
      # Scalar login (Authorization Code + PKCE): URLs the developer's browser opens, hence localhost.
      OpenApi__OAuth2__AuthorizationUrl: http://localhost:8180/realms/clean-architecture/protocol/openid-connect/auth
      OpenApi__OAuth2__TokenUrl: http://localhost:8180/realms/clean-architecture/protocol/openid-connect/token
      OpenApi__OAuth2__ClientId: scalar
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
