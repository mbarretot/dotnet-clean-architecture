services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cleanarchitecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanarchitecture"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      # The image has no curl/wget.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/CleanArchitecture.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=cleanarchitecture;Username=postgres;Password=postgres"
      ConnectionStrings__Cache: "redis:6379"
      Authentication__Schemes__Bearer__Authority: http://keycloak:8080/realms/clean-architecture
      Authentication__Schemes__Bearer__ValidIssuers__0: http://localhost:8180/realms/clean-architecture
      Authentication__Schemes__Bearer__ValidAudiences__0: clean-architecture-api
      Authentication__Schemes__Bearer__RequireHttpsMetadata: "false"
      OpenApi__OAuth2__AuthorizationUrl: http://localhost:8180/realms/clean-architecture/protocol/openid-connect/auth
      OpenApi__OAuth2__TokenUrl: http://localhost:8180/realms/clean-architecture/protocol/openid-connect/token
      OpenApi__OAuth2__ClientId: scalar
    ports:
      - "8080:8080"
    healthcheck:
      # The runtime image has no curl/wget, and its /bin/sh (dash) lacks /dev/tcp, so bash runs the probe.
      # /health includes the database readiness check.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'Healthy' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
