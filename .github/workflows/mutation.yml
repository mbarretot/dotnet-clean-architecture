name: Mutation Testing

# Stryker.NET mutates the Domain and Application layers and runs the unit tests against each mutant. A mutation
# score below the `break` threshold in tests/CleanArchitecture.Application.UnitTests/stryker-config.json fails the job.
on:
  pull_request:
    branches: [main]
    paths:
      - src/CleanArchitecture.Domain/**
      - src/CleanArchitecture.Application/**
      - src/CleanArchitecture.SharedKernel/**
      - tests/CleanArchitecture.Application.UnitTests/**
      - .github/workflows/mutation.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  stryker:
    name: Stryker (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [Domain, Application]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: tests/CleanArchitecture.Application.UnitTests
        run: >-
          dotnet stryker
          --project CleanArchitecture.${{ matrix.project }}.csproj
          --output "$GITHUB_WORKSPACE/StrykerOutput/${{ matrix.project }}"

      - name: Publish mutation summary
        if: ${{ !cancelled() && hashFiles('StrykerOutput/**/mutation-report.md') != '' }}
        run: cat StrykerOutput/${{ matrix.project }}/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: ${{ !cancelled() && hashFiles('StrykerOutput/**/mutation-report.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.project }}
          path: StrykerOutput/${{ matrix.project }}/reports
          retention-days: 14
