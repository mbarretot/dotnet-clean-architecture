name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets cd.yml call this workflow as its build/test gate instead of duplicating it.
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          # Pinned to the exact SDK global.json requires (rollForward: latestFeature makes this
          # a floor, not a ceiling — keeping CI and global.json in lockstep avoids drift).
          dotnet-version: "10.0.302"
          cache: true
          # No packages.lock.json in this repo (Central Package Management via
          # Directory.Packages.props instead), so the cache key is derived from the CPM file
          # and every csproj rather than setup-dotnet's default lock-file lookup.
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore CleanArchitecture.slnx

      - name: Check for vulnerable NuGet packages
        # `dotnet list package --vulnerable` exits 0 even when it finds advisories, and its text
        # output is localized, so the gate parses the JSON report (top-level and transitive).
        run: |
          dotnet list CleanArchitecture.slnx package --vulnerable --include-transitive --format json \
            > vulnerable-packages.json
          findings=$(jq -r '
            .projects[] as $p | ($p.frameworks // [])[] as $f
            | (($f.topLevelPackages // []) + ($f.transitivePackages // []))[]
            | select((.vulnerabilities // []) | length > 0) as $pkg
            | $pkg.vulnerabilities[]
            | "\($p.path | split("/") | last) [\($f.framework)] \($pkg.id) \($pkg.resolvedVersion): \(.severity) \(.advisoryurl)"
          ' vulnerable-packages.json)
          if [ -n "$findings" ]; then
            echo "::error::Vulnerable NuGet packages found:"
            echo "$findings"
            exit 1
          fi
          echo "No vulnerable NuGet packages (including transitive)."

      - name: Build (warnings as errors)
        run: dotnet build CleanArchitecture.slnx --no-restore -warnaserror

      - name: Test (with coverage)
        run: >-
          dotnet test CleanArchitecture.slnx --no-build
          --coverage --coverage-output-format cobertura
          --coverage-settings CodeCoverage.config
          --results-directory TestResults
          | tee test-output.log
        # Test projects run on Microsoft.Testing.Platform (global.json "test.runner"), so MTP
        # options are passed directly: no VSTest `--collect`/`--logger`, no `--` separator.
        # Coverage comes from Microsoft.Testing.Extensions.CodeCoverage, referenced by every test
        # project via Directory.Build.props; test assemblies are excluded by default and
        # CodeCoverage.config drops EF migrations and generated code.

      - name: Upload test results log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-output.log
          retention-days: 14

      - name: Restore local tools
        if: ${{ !cancelled() && hashFiles('TestResults/*.cobertura.xml') != '' }}
        run: dotnet tool restore

      - name: Merge coverage reports
        if: ${{ !cancelled() && hashFiles('TestResults/*.cobertura.xml') != '' }}
        run: >-
          dotnet reportgenerator
          "-reports:TestResults/*.cobertura.xml"
          "-targetdir:TestResults/coverage-report"
          "-reporttypes:HtmlInline;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('TestResults/coverage-report/SummaryGithub.md') != '' }}
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('TestResults/coverage-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report
          retention-days: 14

      - name: Verify formatting
        run: dotnet format CleanArchitecture.slnx --verify-no-changes

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Presentation image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CleanArchitecture.Presentation/Dockerfile
          push: false
          tags: cleanarchitecture-presentation:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # Single required-status-check-friendly job: point branch protection at this instead of all
  # three job names individually.
  ci-status:
    name: CI
    if: always()
    needs: [build-test, docker-build-check, terraform-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build-check.result }}" != "success" ] || \
             [ "${{ needs.terraform-lint.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
