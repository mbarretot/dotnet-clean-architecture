name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published CodeQL queries run against unchanged code.
    - cron: "27 4 * * 1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# uses build-mode "manual": the solution builds in about a minute with the pinned SDK,
          # and a real compilation gives CodeQL the full semantic model (resolved references and
          # source-generated code such as OpenAPI/options generators), which build-mode "none"
          # only approximates and can miss data flow through.
          - language: csharp
            build-mode: manual
          # Workflow files (injection, over-broad permissions, untrusted checkout) need no build.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          # Same pin as ci.yml and global.json.
          dotnet-version: "10.0.302"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore CleanArchitecture.slnx
          dotnet build CleanArchitecture.slnx --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
