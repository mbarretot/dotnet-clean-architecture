name: Load Test

# Starts the full stack with Docker Compose (API, PostgreSQL, Redis, Keycloak) and drives it with k6. The thresholds
# in tests/load/api-load.js (error rate, p95 latency per scenario) fail the job when breached.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: k6 duration per scenario (e.g. 1m, 5m)
        default: 1m
      browse-rate:
        description: Browse iterations per second
        default: "40"
      checkout-rate:
        description: Checkout iterations per second
        default: "5"

permissions:
  contents: read

jobs:
  k6:
    name: k6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6
        env:
          DURATION: ${{ inputs.duration || '1m' }}
          BROWSE_RATE: ${{ inputs.browse-rate || '40' }}
          CHECKOUT_RATE: ${{ inputs.checkout-rate || '5' }}
        run: >-
          k6 run tests/load/api-load.js
          --summary-export k6-summary.json
          -e DURATION="$DURATION"
          -e BROWSE_RATE="$BROWSE_RATE"
          -e CHECKOUT_RATE="$CHECKOUT_RATE"

      - name: Upload k6 summary
        if: ${{ !cancelled() && hashFiles('k6-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary
          path: k6-summary.json
          retention-days: 14

      - name: API logs on failure
        if: failure()
        run: docker compose logs api --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
