version: 2

# Weekly, grouped version updates to keep PR noise low. Security updates are not affected by
# these groups or limits: Dependabot opens them as soon as an advisory is published.
updates:
  # NuGet with Central Package Management: Dependabot reads and bumps Directory.Packages.props
  # at the repository root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      microsoft:
        # ASP.NET Core, EF Core and Microsoft.Extensions.* ship together; bump them as one unit.
        patterns:
          - "Microsoft.*"
        exclude-patterns:
          - "Microsoft.Testing.*"
          - "Microsoft.AspNetCore.Mvc.Testing"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "NSubstitute*"
          - "Shouldly"
          - "NetArchTest.Rules"
          - "Respawn"
          - "Testcontainers*"
      minor-and-patch:
        # Everything else (FluentValidation, Npgsql, Scalar, ...) in one PR unless it is a major.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /src/CleanArchitecture.Presentation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  # postgres and keycloak images in the root docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  # Bumps the SDK pinned in global.json. The same version is pinned in ci.yml and codeql.yml
  # (setup-dotnet "dotnet-version"); update those in the same PR or the build will fail.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
