<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="545" viewBox="0 0 1080 545" role="img" aria-labelledby="title desc">
<title id="title">Order state machine with stock reservation and cancellation</title><desc id="desc">Placed transitions to Paid, then Shipped, then Completed. Only Placed or Paid can transition to Cancelled. Placement reserves stock; cancellation releases stock for existing products. Payment and shipment are state changes rather than external integrations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>svg{--canvas:#f8fafc;--ink:#0f172a;--muted:#475569;--arrow:#64748b;--accent:#0f766e;--delivery:#eef2ff;--delivery-border:#a5b4fc;--application:#e0f2fe;--application-border:#7dd3fc;--domain:#ccfbf1;--domain-border:#5eead4;--external:#fffbeb;--external-border:#fcd34d;--platform:#f1f5f9;--platform-border:#cbd5e1;--cancel:#fff1f2;--cancel-border:#fda4af}
@media(prefers-color-scheme:dark){svg{--canvas:#0f172a;--ink:#f1f5f9;--muted:#cbd5e1;--arrow:#94a3b8;--accent:#5eead4;--delivery:#252747;--delivery-border:#818cf8;--application:#102d43;--application-border:#38bdf8;--domain:#113833;--domain-border:#2dd4bf;--external:#3a2e17;--external-border:#fbbf24;--platform:#1e293b;--platform-border:#64748b;--cancel:#3d202c;--cancel-border:#fb7185}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.heading{font-size:27px;font-weight:650;fill:var(--ink)}.label{font-size:20px;font-weight:650;fill:var(--ink)}.copy{font-size:16px;fill:var(--muted)}.small{font-size:14px;fill:var(--muted)}.line{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#arrow)}.pill{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:var(--accent)}.canvas{fill:var(--canvas)}
.delivery{fill:var(--delivery);stroke:var(--delivery-border);stroke-width:1.5}.cancel{fill:var(--cancel);stroke:var(--cancel-border);stroke-width:1.5}.platform{fill:var(--platform);stroke:var(--platform-border);stroke-width:1.5}.application{fill:var(--application);stroke:var(--application-border);stroke-width:1.5}.external{fill:var(--external);stroke:var(--external-border);stroke-width:1.5}.domain{fill:var(--domain);stroke:var(--domain-border);stroke-width:1.5}</style>
<rect width="1080" height="545" rx="20" class="canvas"/>
<text x="40" y="42" class="pill">03 / ORDER LIFECYCLE</text><text x="40" y="82" class="heading">Reserve stock once. Move through explicit business states.</text><rect x="45" y="155" width="195" height="95" rx="14" class="domain"/><text x="67" y="187" class="label">Placed</text><text x="67" y="215" class="copy">Stock reserved</text><rect x="310" y="155" width="195" height="95" rx="14" class="domain"/><text x="332" y="187" class="label">Paid</text><text x="332" y="215" class="copy">Payment recorded</text><rect x="575" y="155" width="195" height="95" rx="14" class="domain"/><text x="597" y="187" class="label">Shipped</text><text x="597" y="215" class="copy">Shipment recorded</text><rect x="840" y="155" width="195" height="95" rx="14" class="domain"/><text x="862" y="187" class="label">Completed</text><text x="862" y="215" class="copy">Order finished</text><path d="M240 203 H310" class="line"/><text x="275" y="185" class="small" text-anchor="middle">pay</text><path d="M505 203 H575" class="line"/><text x="540" y="185" class="small" text-anchor="middle">ship</text><path d="M770 203 H840" class="line"/><text x="805" y="185" class="small" text-anchor="middle">complete</text><rect x="177" y="345" width="330" height="90" rx="14" class="cancel"/><text x="199" y="377" class="label">Cancelled</text><text x="199" y="405" class="copy">Release stock for existing products.</text><path d="M142 250 V390 H177" class="line"/><path d="M407 250 V345" class="line"/><text x="68" y="313" class="small">cancel</text><text x="427" y="313" class="small">cancel</text><text x="45" y="482" class="small">Customer actions: place, view, pay, cancel. Fulfillment scope: ship, complete. Invalid transitions: HTTP 409.</text><text x="45" y="509" class="small">Pay and ship change state only: no payment gateway, carrier integration or refund processing is implemented.</text>
</svg>
