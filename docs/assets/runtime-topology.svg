<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">Local application runtime topology</title><desc id="desc">A client gets tokens from Keycloak and sends JWT-authenticated HTTP calls to the API. The API retrieves identity signing keys and uses PostgreSQL and Redis. OpenTelemetry exports to the Aspire dashboard. Docker Compose does not start an Aspire dashboard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>svg{--canvas:#f8fafc;--ink:#0f172a;--muted:#475569;--arrow:#64748b;--accent:#0f766e;--delivery:#eef2ff;--delivery-border:#a5b4fc;--application:#e0f2fe;--application-border:#7dd3fc;--domain:#ccfbf1;--domain-border:#5eead4;--external:#fffbeb;--external-border:#fcd34d;--platform:#f1f5f9;--platform-border:#cbd5e1;--cancel:#fff1f2;--cancel-border:#fda4af}
@media(prefers-color-scheme:dark){svg{--canvas:#0f172a;--ink:#f1f5f9;--muted:#cbd5e1;--arrow:#94a3b8;--accent:#5eead4;--delivery:#252747;--delivery-border:#818cf8;--application:#102d43;--application-border:#38bdf8;--domain:#113833;--domain-border:#2dd4bf;--external:#3a2e17;--external-border:#fbbf24;--platform:#1e293b;--platform-border:#64748b;--cancel:#3d202c;--cancel-border:#fb7185}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.heading{font-size:27px;font-weight:650;fill:var(--ink)}.label{font-size:20px;font-weight:650;fill:var(--ink)}.copy{font-size:16px;fill:var(--muted)}.small{font-size:14px;fill:var(--muted)}.line{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#arrow)}.pill{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:var(--accent)}.canvas{fill:var(--canvas)}
.delivery{fill:var(--delivery);stroke:var(--delivery-border);stroke-width:1.5}.cancel{fill:var(--cancel);stroke:var(--cancel-border);stroke-width:1.5}.platform{fill:var(--platform);stroke:var(--platform-border);stroke-width:1.5}.application{fill:var(--application);stroke:var(--application-border);stroke-width:1.5}.external{fill:var(--external);stroke:var(--external-border);stroke-width:1.5}.domain{fill:var(--domain);stroke:var(--domain-border);stroke-width:1.5}</style>
<rect width="1080" height="640" rx="20" class="canvas"/>
<text x="40" y="42" class="pill">02 / LOCAL RUNTIME</text><text x="40" y="82" class="heading">One API. Separate storage, identity and observability.</text><rect x="45" y="230" width="240" height="105" rx="14" class="delivery"/><text x="67" y="262" class="label">Client / Scalar</text><text x="67" y="290" class="copy">Gets a token, then</text><text x="67" y="313" class="copy">calls protected routes.</text><rect x="380" y="230" width="330" height="105" rx="14" class="application"/><text x="402" y="262" class="label">ASP.NET Core API</text><text x="402" y="290" class="copy">Application + Domain</text><text x="402" y="313" class="copy">Infrastructure adapters</text><rect x="380" y="120" width="330" height="80" rx="14" class="external"/><text x="402" y="152" class="label">Keycloak</text><text x="402" y="180" class="copy">Local OIDC identity provider</text><rect x="795" y="230" width="240" height="85" rx="14" class="external"/><text x="817" y="262" class="label">PostgreSQL</text><text x="817" y="290" class="copy">Persistent application data</text><rect x="795" y="375" width="240" height="85" rx="14" class="external"/><text x="817" y="407" class="label">Redis</text><text x="817" y="435" class="copy">HybridCache L2 tier</text><rect x="380" y="450" width="330" height="85" rx="14" class="platform"/><text x="402" y="482" class="label">Aspire dashboard</text><text x="402" y="510" class="copy">Logs, traces and metrics</text><path d="M165 230 V160 H380" class="line"/><text x="70" y="144" class="small">sign in / get token</text><path d="M285 285 H380" class="line"/><text x="303" y="270" class="small">JWT</text><path d="M550 230 V200" class="line"/><text x="575" y="218" class="small">signing keys</text><path d="M710 273 H795" class="line"/><text x="738" y="257" class="small">SQL</text><path d="M710 305 H750 V417 H795" class="line"/><text x="770" y="358" class="small">cache</text><path d="M550 335 V450" class="line" stroke-dasharray="6 5"/><text x="574" y="394" class="small">OpenTelemetry</text><text x="45" y="580" class="small">Aspire orchestrates all components shown. Compose starts the API, database, cache and Keycloak only.</text><text x="45" y="606" class="small">Without ConnectionStrings:Cache, HybridCache stays in process. The dashboard belongs to Aspire.</text>
</svg>
