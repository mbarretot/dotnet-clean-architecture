<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">Clean Architecture code dependency overview</title><desc id="desc">Presentation references Application and Infrastructure. Infrastructure implements ports and references Application and SharedKernel. Application references Domain; Domain references SharedKernel. Additional direct references are listed in the README.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:27px;font-weight:700;fill:#0f172a}.label{font-size:20px;font-weight:700;fill:#0f172a}.copy{font-size:16px;fill:#475569}.small{font-size:14px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.pill{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#0f766e}</style>
<rect width="1080" height="700" rx="20" fill="#f8fafc"/>
<text x="40" y="42" class="pill">01 / CODE DEPENDENCIES</text><text x="40" y="82" class="heading">Keep business rules independent of delivery and storage.</text><rect x="80" y="115" width="920" height="85" rx="14" fill="#eef2ff" stroke="#c4b5fd"/><text x="102" y="147" class="label">Presentation</text><text x="102" y="175" class="copy">HTTP endpoints + composition root: wires interfaces to implementations.</text><rect x="80" y="255" width="285" height="125" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="102" y="287" class="label">Infrastructure</text><text x="102" y="315" class="copy">EF Core + PostgreSQL</text><text x="102" y="338" class="copy">Implements repository ports.</text><rect x="445" y="255" width="555" height="95" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/><text x="467" y="287" class="label">Application</text><text x="467" y="315" class="copy">Use-case handlers, validation, commands and queries.</text><rect x="445" y="400" width="555" height="95" rx="14" fill="#ccfbf1" stroke="#5eead4"/><text x="467" y="432" class="label">Domain</text><text x="467" y="460" class="copy">Product + Order aggregates, value objects, business rules.</text><rect x="80" y="545" width="920" height="85" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="102" y="577" class="label">SharedKernel</text><text x="102" y="605" class="copy">Result types, entity bases, messaging primitives and common abstractions.</text><path d="M222 200 V255" class="line"/><path d="M722 200 V255" class="line"/><path d="M365 302 H445" class="line"/><path d="M722 350 V400" class="line"/><path d="M722 495 V545" class="line"/><path d="M222 380 V545" class="line"/><text x="256" y="230" class="small">references</text><text x="400" y="285" class="small" text-anchor="middle">references</text><text x="750" y="382" class="small">references</text><text x="80" y="668" class="small">Solid arrows = selected compile-time references, NOT HTTP calls. Full reference matrix is in the README.</text>
</svg>
