<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">Clean Architecture code dependency overview</title><desc id="desc">Presentation references Application and Infrastructure. Infrastructure implements ports and references Application and SharedKernel. Application references Domain; Domain references SharedKernel. Additional direct references are listed in the development guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>svg{--canvas:#f8fafc;--ink:#0f172a;--muted:#475569;--arrow:#64748b;--accent:#0f766e;--delivery:#eef2ff;--delivery-border:#a5b4fc;--application:#e0f2fe;--application-border:#7dd3fc;--domain:#ccfbf1;--domain-border:#5eead4;--external:#fffbeb;--external-border:#fcd34d;--platform:#f1f5f9;--platform-border:#cbd5e1;--cancel:#fff1f2;--cancel-border:#fda4af}
@media(prefers-color-scheme:dark){svg{--canvas:#0f172a;--ink:#f1f5f9;--muted:#cbd5e1;--arrow:#94a3b8;--accent:#5eead4;--delivery:#252747;--delivery-border:#818cf8;--application:#102d43;--application-border:#38bdf8;--domain:#113833;--domain-border:#2dd4bf;--external:#3a2e17;--external-border:#fbbf24;--platform:#1e293b;--platform-border:#64748b;--cancel:#3d202c;--cancel-border:#fb7185}}
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.heading{font-size:27px;font-weight:650;fill:var(--ink)}.label{font-size:20px;font-weight:650;fill:var(--ink)}.copy{font-size:16px;fill:var(--muted)}.small{font-size:14px;fill:var(--muted)}.line{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#arrow)}.pill{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:var(--accent)}.canvas{fill:var(--canvas)}
.delivery{fill:var(--delivery);stroke:var(--delivery-border);stroke-width:1.5}.cancel{fill:var(--cancel);stroke:var(--cancel-border);stroke-width:1.5}.platform{fill:var(--platform);stroke:var(--platform-border);stroke-width:1.5}.application{fill:var(--application);stroke:var(--application-border);stroke-width:1.5}.external{fill:var(--external);stroke:var(--external-border);stroke-width:1.5}.domain{fill:var(--domain);stroke:var(--domain-border);stroke-width:1.5}</style>
<rect width="1080" height="700" rx="20" class="canvas"/>
<text x="40" y="42" class="pill">01 / CODE DEPENDENCIES</text><text x="40" y="82" class="heading">Keep business rules independent of delivery and storage.</text><rect x="80" y="115" width="920" height="85" rx="14" class="delivery"/><text x="102" y="147" class="label">Presentation</text><text x="102" y="175" class="copy">HTTP endpoints + composition root: wires interfaces to implementations.</text><rect x="80" y="255" width="285" height="125" rx="14" class="external"/><text x="102" y="287" class="label">Infrastructure</text><text x="102" y="315" class="copy">EF Core + PostgreSQL</text><text x="102" y="338" class="copy">Implements repository ports.</text><rect x="445" y="255" width="555" height="95" rx="14" class="application"/><text x="467" y="287" class="label">Application</text><text x="467" y="315" class="copy">Use-case handlers, validation, commands and queries.</text><rect x="445" y="400" width="555" height="95" rx="14" class="domain"/><text x="467" y="432" class="label">Domain</text><text x="467" y="460" class="copy">Product + Order aggregates, value objects, business rules.</text><rect x="80" y="545" width="920" height="85" rx="14" class="platform"/><text x="102" y="577" class="label">SharedKernel</text><text x="102" y="605" class="copy">Result types, entity bases, messaging primitives and common abstractions.</text><path d="M222 200 V255" class="line"/><path d="M722 200 V255" class="line"/><path d="M365 302 H445" class="line"/><path d="M722 350 V400" class="line"/><path d="M722 495 V545" class="line"/><path d="M222 380 V545" class="line"/><text x="256" y="230" class="small">references</text><text x="400" y="285" class="small" text-anchor="middle">references</text><text x="750" y="382" class="small">references</text><text x="80" y="668" class="small">Solid arrows = selected compile-time references, NOT HTTP calls. Full reference matrix: development guide.</text>
</svg>
